<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍼灸院node.OMIYA | ご予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2A24;
    --paper:#F3EFE6;
    --paper-soft:#E9E2D2;
    --sage:#6B7A6E;
    --sage-deep:#3D4A3F;
    --sage-pale:#DCE3D9;
    --brass:#B08D57;
    --line: rgba(31,42,36,0.14);
    --danger:#A65A4A;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Shippori Mincho', serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  #app{max-width:720px;margin:0 auto;padding:0 20px 80px;}

  header.site{
    padding:36px 0 20px;
    border-bottom:1px solid var(--line);
    margin-bottom:28px;
  }
  .brand .eyebrow{
    font-size:12px;
    letter-spacing:.16em;
    color:var(--sage);
    margin-bottom:6px;
  }
  .brand h1{
    font-size:28px;
    margin:0;
    color:var(--sage-deep);
    font-weight:700;
  }

  .setup-banner{
    background:#FCEFE9;
    border:1px solid #E3B9A6;
    color:var(--danger);
    border-radius:8px;
    padding:12px 16px;
    font-size:12px;
    margin-bottom:20px;
    line-height:1.7;
  }
  .setup-banner code{
    background:#fff;
    padding:1px 6px;
    border-radius:4px;
  }

  /* ---- Stepper ---- */
  .steps{display:flex;gap:10px;margin-bottom:32px;}
  .step-dot{
    flex:1;
    text-align:center;
    padding-bottom:10px;
    border-bottom:3px solid var(--line);
    font-size:12px;
    color:var(--sage);
    transition:border-color .25s, color .25s;
  }
  .step-dot span{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    margin-bottom:4px;
    opacity:.7;
  }
  .step-dot.active{border-color:var(--sage-deep);color:var(--sage-deep);font-weight:700;}
  .step-dot.done{border-color:var(--brass);color:var(--sage-deep);}

  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px;
  }
  .panel h2{
    font-size:15px;
    margin:0 0 18px;
    color:var(--sage-deep);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel h2::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--brass);
    display:inline-block;
  }

  /* service cards */
  .service-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.service-grid{grid-template-columns:1fr;}}
  .service-card{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    transition:border-color .2s, background .2s;
    text-align:left;
    background:#fff;
  }
  .service-card:hover{border-color:var(--sage);}
  .service-card.selected{
    border-color:var(--sage-deep);
    background:var(--sage-pale);
  }
  .service-card .name{font-weight:700;color:var(--sage-deep);margin-bottom:4px;}
  .service-card .meta{font-size:12px;color:var(--sage);display:flex;justify-content:space-between;}

  /* date/time */
  label.field-label{
    display:block;font-size:12px;color:var(--sage-deep);font-weight:700;
    margin-bottom:8px;letter-spacing:.03em;
  }
  input[type=date], input[type=text], input[type=tel], textarea, select{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 12px;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    background:#fff;
  }
  input:focus, textarea:focus, select:focus, button:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:1px;
  }
  .closed-note{
    font-size:12px;color:var(--danger);margin-top:6px;min-height:16px;
  }

  .slot-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(78px,1fr));
    gap:8px;
    margin-top:14px;
  }
  .slot{
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 4px;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    background:#fff;
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  .slot:hover:not(.full):not(.selected){border-color:var(--sage);}
  .slot.selected{
    background:var(--sage-deep);
    border-color:var(--sage-deep);
    color:var(--paper);
  }
  .slot.full{
    background:var(--paper-soft);
    color:var(--line);
    cursor:not-allowed;
    text-decoration:line-through;
  }

  .form-grid{display:grid;gap:16px;}

  .nav-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:26px;
  }
  button.primary, button.ghost{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
    transition:opacity .2s, background .2s;
  }
  button.primary{
    background:var(--sage-deep);
    color:var(--paper);
  }
  button.primary:disabled{opacity:.4;cursor:not-allowed;}
  button.primary:not(:disabled):hover{background:var(--ink);}
  button.ghost{
    background:transparent;
    color:var(--sage-deep);
    border-color:var(--line);
  }
  button.ghost:hover{border-color:var(--sage);}

  .summary-line{
    display:flex;justify-content:space-between;
    padding:9px 0;
    border-bottom:1px dashed var(--line);
    font-size:14px;
  }
  .summary-line:last-child{border-bottom:none;}
  .summary-line .label{color:var(--sage);}

  .confirm-screen{text-align:center;padding:20px 0;}
  .confirm-screen .mark{
    width:56px;height:56px;border-radius:50%;
    background:var(--sage-pale);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
    color:var(--sage-deep);font-size:24px;
  }
  .confirm-note{
    font-size:13px;color:var(--sage-deep);
    background:var(--paper-soft);
    border-radius:8px;padding:14px 16px;margin-top:18px;
    text-align:left;
  }
  .confirm-id{
    display:inline-block;margin-top:10px;
    font-family:'JetBrains Mono',monospace;
    background:var(--paper-soft);
    padding:6px 14px;border-radius:6px;
    letter-spacing:.05em;
    font-size:13px;
  }
  .empty-state{
    text-align:center;padding:24px 20px;color:var(--sage);font-size:13px;
  }
  .loading{text-align:center;padding:60px 0;color:var(--sage);font-size:13px;}
  .slot-loading{font-size:12px;color:var(--sage);padding:10px 0;}
</style>
</head>
<body>
<div id="app">
  <header class="site">
    <div class="brand">
      <div class="eyebrow serif">SALON REN — 美容室 蓮</div>
      <h1 class="serif">ご予約</h1>
    </div>
  </header>
  <main id="main">
    <div class="loading">読み込み中…</div>
  </main>
</div>

<script>
(function(){
  "use strict";

  // ============================================================
  // 設定: Google Apps Script のウェブアプリURLをここに貼り付けてください
  // 空欄のままだとスプレッドシート連携なしのデモモードで動作します
  // ============================================================
  var CONFIG = {
    GAS_URL: 'https://script.google.com/macros/s/AKfycbyOUzSuGAp3Bdv2f19WtXI5KaleQ8a22x6bYPWL_VAmPRw8gZtStEr8ITVkvUUpQF69/exec'
  };

  // ---------- 固定データ ----------
  var SERVICES = [
    {id:'standard', name:'スタンダード　50分　￥6,500', duration:50, price:6,500},
    {id:'color', name:'プレミアム　80分　￥9,000', duration:80, price:9,000},
    {id:'perm', name:'ポイント　30分　￥4,500', duration:30, price:4,500},
  ];
  var STYLISTS = ['中西友紀'];
  var CAPACITY = 1; // 同時対応可能な席数
  var OPEN_MIN = 10*60;   // 10:00
  var CLOSE_MIN = 19*60;  // 16:00
  var SLOT_STEP = 30;
  var CLOSED_WEEKDAY = 1; // 月曜定休 (0=日,1=月,...)
  var DEMO_KEY = 'salon_ren_demo_reservations';

  var root = document.getElementById('main');
  var loaded = false;
  var demoReservations = []; // GAS未設定時のみ使うデモ用データ

  var state = {
    step: 1,
    service: null,
    date: '',
    time: null,
    stylist: STYLISTS[0],
    name: '',
    phone: '',
    note: '',
    lastId: null,
    slotsLoading: false,
    dateBookings: [] // 選択中の日付の既存予約(有効分のみ)
  };

  // ---------- バックエンド(GAS or デモ) ----------
  function usingGas(){ return !!CONFIG.GAS_URL; }

  function jsonpGet(url){
    return new Promise(function(resolve, reject){
      var cbName = 'gasCb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
      var script = document.createElement('script');
      var timeout = setTimeout(function(){
        cleanup();
        reject(new Error('タイムアウトしました'));
      }, 8000);
      function cleanup(){
        delete window[cbName];
        if(script.parentNode) script.parentNode.removeChild(script);
        clearTimeout(timeout);
      }
      window[cbName] = function(data){
        cleanup();
        resolve(data);
      };
      script.onerror = function(){
        cleanup();
        reject(new Error('読み込みに失敗しました'));
      };
      script.src = url + (url.indexOf('?')>=0?'&':'?') + 'callback=' + cbName;
      document.body.appendChild(script);
    });
  }

  async function fetchActiveBookings(){
    if(usingGas()){
      try{
        var data = await jsonpGet(CONFIG.GAS_URL);
        return Array.isArray(data) ? data : [];
      }catch(e){
        console.error('予約状況の取得に失敗しました:', e);
        return [];
      }
    }else{
      try{
        var res = await window.storage.get(DEMO_KEY, true);
        demoReservations = res && res.value ? JSON.parse(res.value) : [];
      }catch(e){
        demoReservations = [];
      }
      return demoReservations.filter(function(r){ return r.status!=='キャンセル'; });
    }
  }

  async function submitReservation(reservation){
    if(usingGas()){
      // GASはプリフライトを避けるため text/plain + no-cors で送信(応答は読み取れない)
      await fetch(CONFIG.GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(reservation)
      });
      return true;
    }else{
      demoReservations.push(reservation);
      try{
        var result = await window.storage.set(DEMO_KEY, JSON.stringify(demoReservations), true);
        if(!result) console.error('保存に失敗しました');
      }catch(e){
        console.error('Storage error:', e);
      }
      return true;
    }
  }

  // ---------- ユーティリティ ----------
  function pad(n){return n<10 ? '0'+n : ''+n;}
  function minToLabel(min){
    var h = Math.floor(min/60), m = min%60;
    return pad(h)+':'+pad(m);
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function weekdayOf(iso){
    var d = new Date(iso+'T00:00:00');
    return d.getDay();
  }
  function formatDateJP(iso){
    if(!iso) return '';
    var d = new Date(iso+'T00:00:00');
    var days = ['日','月','火','水','木','金','土'];
    return (d.getMonth()+1)+'月'+d.getDate()+'日('+days[d.getDay()]+')';
  }
  function serviceById(id){
    return SERVICES.filter(function(s){return s.id===id;})[0];
  }
  function yen(n){ return '¥'+n.toLocaleString('ja-JP'); }
  function genId(){
    return 'R'+Date.now().toString(36).toUpperCase().slice(-6);
  }

  function overlapCount(bookingsOnDate, startMin, duration){
    var endMin = startMin+duration;
    return bookingsOnDate.filter(function(r){
      var rStart = Number(r.startMin), rEnd = rStart+Number(r.duration);
      return rStart < endMin && rEnd > startMin;
    }).length;
  }

  function availableSlots(dateISO, duration, bookingsOnDate){
    var slots = [];
    var isToday = dateISO === todayISO();
    var now = new Date();
    var nowMin = now.getHours()*60+now.getMinutes();
    for(var t=OPEN_MIN; t+duration<=CLOSE_MIN; t+=SLOT_STEP){
      if(isToday && t <= nowMin) continue;
      var used = overlapCount(bookingsOnDate, t, duration);
      slots.push({ start:t, label:minToLabel(t), full: used>=CAPACITY });
    }
    return slots;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- レンダリング ----------
  function render(){
    if(!loaded){
      root.innerHTML = '<div class="loading">読み込み中…</div>';
      return;
    }
    var html = '';
    if(!usingGas()){
      html += '<div class="setup-banner">スプレッドシート連携が未設定のため、現在はデモモードで動作しています。'
        + 'このコードの <code>CONFIG.GAS_URL</code> にGoogle Apps ScriptのウェブアプリURLを設定すると、'
        + '予約がスプレッドシートに記録され、メール通知が届くようになります。</div>';
    }
    html += '<div class="steps">';
    for(var i=1;i<=4;i++){
      var cls = 'step-dot' + (state.step===i?' active':'') + (state.step>i?' done':'');
      html += '<div class="'+cls+'"><span>0'+i+'</span>'+stepLabel(i)+'</div>';
    }
    html += '</div>';

    html += '<div class="panel">';
    if(state.step===1) html += renderStep1();
    else if(state.step===2) html += renderStep2();
    else if(state.step===3) html += renderStep3();
    else html += renderStep4();
    html += '</div>';

    root.innerHTML = html;
    bindStepEvents();
  }

  function stepLabel(n){
    return ['メニュー','日時','お客様情報','完了'][n-1];
  }

  function renderStep1(){
    var h = '<h2>ご希望のメニューをお選びください</h2><div class="service-grid">';
    SERVICES.forEach(function(s){
      var sel = state.service===s.id ? ' selected' : '';
      h += '<button type="button" class="service-card'+sel+'" data-service="'+s.id+'">'
         + '<div class="name">'+s.name+'</div>'
         + '<div class="meta"><span>'+s.duration+'分</span><span>'+yen(s.price)+'</span></div>'
         + '</button>';
    });
    h += '</div>';
    h += '<div class="nav-row"><span></span><button class="primary" id="next1" '+(state.service?'':'disabled')+'>次へ</button></div>';
    return h;
  }

  function renderStep2(){
    var svc = serviceById(state.service);
    var h = '<h2>ご希望の日時をお選びください</h2>';
    h += '<div class="form-grid">';
    h += '<div><label class="field-label" for="dateInput">来店日</label>';
    h += '<input type="date" id="dateInput" min="'+todayISO()+'" value="'+state.date+'">';
    h += '<div class="closed-note" id="closedNote"></div></div>';

    if(state.date && weekdayOf(state.date)!==CLOSED_WEEKDAY){
      if(state.slotsLoading){
        h += '<div class="slot-loading">空き状況を確認中…</div>';
      }else{
        var slots = availableSlots(state.date, svc.duration, state.dateBookings);
        h += '<div><label class="field-label">お時間('+svc.duration+'分)</label>';
        if(slots.length===0){
          h += '<div class="empty-state">この日はご案内できる時間がありません。他の日をお選びください。</div>';
        }else{
          h += '<div class="slot-grid">';
          slots.forEach(function(sl){
            var cls = 'slot' + (sl.full?' full':'') + (state.time===sl.start?' selected':'');
            h += '<div class="'+cls+'" data-slot="'+sl.start+'">'+sl.label+'</div>';
          });
          h += '</div></div>';
        }
        h += '<div><label class="field-label" for="stylistSelect">担当スタイリスト</label>';
        h += '<select id="stylistSelect">';
        STYLISTS.forEach(function(name){
          h += '<option value="'+name+'" '+(state.stylist===name?'selected':'')+'>'+name+'</option>';
        });
        h += '</select></div>';
      }
    }
    h += '</div>';

    var canNext = state.date && weekdayOf(state.date)!==CLOSED_WEEKDAY && state.time!==null && !state.slotsLoading;
    h += '<div class="nav-row"><button class="ghost" id="back2">戻る</button><button class="primary" id="next2" '+(canNext?'':'disabled')+'>次へ</button></div>';
    return h;
  }

  function renderStep3(){
    var h = '<h2>お客様情報をご入力ください</h2><div class="form-grid">';
    h += '<div><label class="field-label" for="nameInput">お名前</label><input type="text" id="nameInput" placeholder="山田 花子" value="'+escapeHtml(state.name)+'"></div>';
    h += '<div><label class="field-label" for="phoneInput">電話番号</label><input type="tel" id="phoneInput" placeholder="090-1234-5678" value="'+escapeHtml(state.phone)+'"></div>';
    h += '<div><label class="field-label" for="noteInput">ご要望・備考(任意)</label><textarea id="noteInput" rows="3" placeholder="例:前回と同じ長さで">'+escapeHtml(state.note)+'</textarea></div>';
    h += '</div>';

    var svc = serviceById(state.service);
    h += '<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">';
    h += '<div class="summary-line"><span class="label">メニュー</span><span>'+svc.name+'</span></div>';
    h += '<div class="summary-line"><span class="label">日時</span><span>'+formatDateJP(state.date)+' '+minToLabel(state.time)+'</span></div>';
    h += '<div class="summary-line"><span class="label">担当</span><span>'+state.stylist+'</span></div>';
    h += '<div class="summary-line"><span class="label">お会計目安</span><span>'+yen(svc.price)+'</span></div>';
    h += '</div>';

    var canNext = state.name.trim() && state.phone.trim();
    h += '<div class="nav-row"><button class="ghost" id="back3">戻る</button><button class="primary" id="next3" '+(canNext?'':'disabled')+'>この内容で予約希望を送る</button></div>';
    return h;
  }

  function renderStep4(){
    var svc = serviceById(state.service);
    var h = '<div class="confirm-screen">';
    h += '<div class="mark">✓</div>';
    h += '<h2 class="serif" style="justify-content:center;font-size:18px;">ご予約希望を受け付けました</h2>';
    h += '<div class="summary-line"><span class="label">お名前</span><span>'+escapeHtml(state.name)+' 様</span></div>';
    h += '<div class="summary-line"><span class="label">メニュー</span><span>'+svc.name+'</span></div>';
    h += '<div class="summary-line"><span class="label">日時</span><span>'+formatDateJP(state.date)+' '+minToLabel(state.time)+'</span></div>';
    h += '<div class="summary-line"><span class="label">担当</span><span>'+state.stylist+'</span></div>';
    h += '<div><span class="confirm-id mono">受付番号 '+state.lastId+'</span></div>';
    h += '<div class="confirm-note">この時点ではまだ<strong>ご予約は確定しておりません</strong>。内容を確認のうえ、担当より折り返しご連絡し、確認が取れた時点でご予約確定となります。</div>';
    h += '<div class="nav-row" style="justify-content:center;margin-top:28px;"><button class="primary" id="newBooking">別の予約をする</button></div>';
    h += '</div>';
    return h;
  }

  async function loadSlotsForDate(){
    state.slotsLoading = true;
    render();
    var all = await fetchActiveBookings();
    state.dateBookings = all.filter(function(r){ return r.date===state.date; });
    state.slotsLoading = false;
    render();
  }

  function bindStepEvents(){
    if(state.step===1){
      root.querySelectorAll('[data-service]').forEach(function(el){
        el.addEventListener('click', function(){
          state.service = el.getAttribute('data-service');
          render();
        });
      });
      var n1 = document.getElementById('next1');
      if(n1) n1.addEventListener('click', function(){ state.step=2; render(); });
    }
    if(state.step===2){
      var dateInput = document.getElementById('dateInput');
      if(dateInput) dateInput.addEventListener('change', function(){
        var v = dateInput.value;
        var note = document.getElementById('closedNote');
        state.date = v;
        state.time = null;
        if(v && weekdayOf(v)===CLOSED_WEEKDAY){
          note.textContent = '月曜日は定休日です。別の日をお選びください。';
          render();
        }else{
          note.textContent = '';
          loadSlotsForDate();
        }
      });
      root.querySelectorAll('.slot:not(.full)').forEach(function(el){
        el.addEventListener('click', function(){
          state.time = parseInt(el.getAttribute('data-slot'),10);
          render();
        });
      });
      var stylistSelect = document.getElementById('stylistSelect');
      if(stylistSelect) stylistSelect.addEventListener('change', function(){
        state.stylist = stylistSelect.value;
      });
      var back2 = document.getElementById('back2');
      if(back2) back2.addEventListener('click', function(){ state.step=1; render(); });
      var next2 = document.getElementById('next2');
      if(next2) next2.addEventListener('click', function(){ state.step=3; render(); });
    }
    if(state.step===3){
      var nameInput = document.getElementById('nameInput');
      var phoneInput = document.getElementById('phoneInput');
      var noteInput = document.getElementById('noteInput');
      [nameInput, phoneInput, noteInput].forEach(function(el){
        if(!el) return;
        el.addEventListener('input', function(){
          state.name = nameInput.value;
          state.phone = phoneInput.value;
          state.note = noteInput.value;
          var btn = document.getElementById('next3');
          if(btn) btn.disabled = !(state.name.trim() && state.phone.trim());
        });
      });
      var back3 = document.getElementById('back3');
      if(back3) back3.addEventListener('click', function(){ state.step=2; render(); });
      var next3 = document.getElementById('next3');
      if(next3) next3.addEventListener('click', async function(){
        next3.disabled = true;
        next3.textContent = '送信中…';
        var svc = serviceById(state.service);
        var id = genId();
        var reservation = {
          id:id,
          date: state.date,
          startMin: state.time,
          duration: svc.duration,
          serviceId: svc.id,
          serviceName: svc.name,
          stylist: state.stylist,
          name: state.name.trim(),
          phone: state.phone.trim(),
          note: state.note.trim(),
          status: '確認待ち',
          createdAt: Date.now()
        };
        try{
          await submitReservation(reservation);
        }catch(e){
          console.error(e);
        }
        state.lastId = id;
        state.step = 4;
        render();
      });
    }
    if(state.step===4){
      var nb = document.getElementById('newBooking');
      if(nb) nb.addEventListener('click', function(){
        state = { step:1, service:null, date:'', time:null, stylist:STYLISTS[0], name:'', phone:'', note:'', lastId:null, slotsLoading:false, dateBookings:[] };
        render();
      });
    }
  }

  // ---------- 初期化 ----------
  loaded = true;
  render();
})();
</script>
</body>
</html>
